# Second Brain — Docker-Compose-Stack (Hostinger VPS, Franks selbst gehostetes Gehirn)
# Doku/Plan: best-practices/second-brain/UMSETZUNGSPLAN.md
# Sicherheitsprinzip: ALLE Dienste nur an 127.0.0.1 (kein offener Port ausser SSH;
# der externe Zugang kommt spaeter ueber Reverse-Proxy/VPN).

services:
  qdrant:
    image: qdrant/qdrant:latest      # TODO: nach erstem Lauf auf feste Version pinnen (Reproduzierbarkeit/Umzug)
    container_name: sb-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"        # REST-API — NUR lokal erreichbar
      - "127.0.0.1:6334:6334"        # gRPC    — NUR lokal erreichbar
    volumes:
      - ./qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}   # aus .env (NICHT im Repo)
      QDRANT__TELEMETRY_DISABLED: "true"
    deploy:
      resources:
        limits:
          memory: 2G                 # harte Obergrenze (RAM-Schutz, OOM-Vermeidung)
          cpus: "1.5"
        reservations:
          memory: 512M               # weiche Garantie
          cpus: "0.5"
    # Healthcheck bewusst extern (curl vom Host) statt Container-intern —
    # das Qdrant-Image bringt keine garantierte Shell/curl mit.

  ollama:
    image: ollama/ollama:latest      # lokale Embedding-/LLM-Maschine (Datenhoheit, kein Datenabfluss)
    container_name: sb-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"      # NUR lokal erreichbar
    volumes:
      - ./ollama-data:/root/.ollama  # Modelle persistent auf der Platte
    environment:
      OLLAMA_KEEP_ALIVE: "30m"       # Modell nach Nutzung 30 Min im RAM halten, dann freigeben
    deploy:
      resources:
        limits:
          memory: 4G                 # genug fuer BGE-M3-Embeddings auf CPU
          cpus: "2.0"
        reservations:
          memory: 1G
