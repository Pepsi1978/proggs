<!doctype html>
<html lang="de" data-werft-theme="22hell" data-theme="light" style="color-scheme: light;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experimente-SPEC-v1 — Selbstbild — 2.2 Hell</title>
<link rel="stylesheet" href="../design.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.werft-screen { display: block !important; position: relative; overflow: hidden; }
</style>
</head>
<body>
<div class="werft-screens" style="width: 412px;">
<section class="werft-screen" data-screen-id="B-09" data-screen-name="Selbstbild" style="width: 1440px; min-height: 900px;">
<section class="b09-screen" data-werft-screen="B-09" aria-labelledby="b09-title">
  <header class="b09-topbar">
    <button
      class="b09-back"
      type="button"
      aria-label="Zurück zu Einstellungen"
      data-werft-navigate="B-08"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11H7.83l5.59-5.59c.39-.39.39-1.03 0-1.42-.39-.39-1.03-.39-1.42 0l-7.29 7.3c-.39.39-.39 1.02 0 1.41L12 20c.39.39 1.03.39 1.42 0 .39-.39.39-1.03 0-1.42L7.83 13H20c.55 0 1-.45 1-1s-.45-1-1-1z"/>
      </svg>
    </button>
    <h1 class="b09-title" id="b09-title">Selbstbild</h1>
  </header>

  <main class="b09-content">
    <p class="b09-intro">
      Alles, was die App dauerhaft über dich wissen soll.<br>
      Je mehr hier steht, desto genauer treffen die Vorschläge.
    </p>

    <textarea
      class="b09-editor"
      aria-label="Selbstbild"
      data-werft-funktion="F-21"
      placeholder="Wer bist du? Was prägt dich? Was war?&#10;Sprich einfach drauflos."
      spellcheck="true"
    ></textarea>

    <div class="b09-controls">
      <button
        class="b09-improve"
        type="button"
        aria-pressed="false"
        data-werft-funktion="F-02"
      >
        <span class="b09-improve-label">Text mit KI verbessern</span>
      </button>

      <div class="b09-mic-wrap">
        <span class="b09-mic-ring" aria-hidden="true"></span>
        <button
          class="b09-mic-button"
          type="button"
          aria-label="Selbstbild einsprechen"
          aria-pressed="false"
          data-werft-funktion="F-21"
        >
          <svg class="b09-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
          </svg>
          <svg class="b09-stop-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 19q-.825 0-1.413-.588T6 17V7q0-.825.587-1.413T8 5h8q.825 0 1.413.587T18 7v10q0 .825-.587 1.412T16 19H8Z"/>
          </svg>
        </button>
      </div>

      <span aria-hidden="true"></span>
    </div>
  </main>

  <script>
    (() => {
      const screen = document.currentScript.closest(".b09-screen");
      const editor = screen.querySelector(".b09-editor");
      const improve = screen.querySelector(".b09-improve");
      const improveLabel = screen.querySelector(".b09-improve-label");
      const micWrap = screen.querySelector(".b09-mic-wrap");
      const micButton = screen.querySelector(".b09-mic-button");
      const backButton = screen.querySelector(".b09-back");
      const storageKey = "werft-experimente-selbstbild";

      try {
        editor.value = localStorage.getItem(storageKey) || "";
      } catch (_) {}

      const save = () => {
        try {
          localStorage.setItem(storageKey, editor.value);
        } catch (_) {}
      };

      editor.addEventListener("input", save);
      backButton.addEventListener("click", save);
      window.addEventListener("pagehide", save);

      improve.addEventListener("click", () => {
        const improved = improve.getAttribute("aria-pressed") === "true";
        improve.setAttribute("aria-pressed", String(!improved));
        improveLabel.textContent = improved
          ? "Text mit KI verbessern"
          : "Zurücknehmen";
      });

      micButton.addEventListener("click", () => {
        const recording = micWrap.classList.toggle("is-recording");
        micButton.setAttribute("aria-pressed", String(recording));
        micButton.setAttribute(
          "aria-label",
          recording ? "Aufnahme stoppen" : "Selbstbild einsprechen"
        );
      });
    })();
  </script>
</section>
</section>
</div>
</body>
</html>
