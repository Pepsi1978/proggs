<!doctype html>
<html lang="de" data-werft-theme="darkpmcolors" data-theme="dark" style="color-scheme: dark;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfectMoment — RawDataScreen — DarkPmColors (Dunkel)</title>
<link rel="stylesheet" href="../design.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.werft-screen { display: block !important; position: relative; overflow: hidden; }
</style>
</head>
<body>
<div class="werft-screens" style="width: 412px;">
<section class="werft-screen" data-screen-id="compose:RawDataScreen" data-screen-name="RawDataScreen" style="width: 412px; min-height: 915px;">
<section class="pm-rawdata-screen" data-werft-screen="RawDataScreen" aria-label="Rohdaten">
  <div class="pm-rawdata-safe-frame">
    <header class="pm-rawdata-header">
      <button
        class="pm-rawdata-back"
        type="button"
        aria-label="Zurück"
        data-werft-navigate="compose:SettingsScreen"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <h1 class="pm-rawdata-title">Rohdaten</h1>
    </header>

    <div class="pm-rawdata-list">
      <h2 class="pm-rawdata-heading">Sitzungen (0)</h2>
      <h2 class="pm-rawdata-heading">Skills (0)</h2>
      <h2 class="pm-rawdata-heading">Aufhänger (0)</h2>
    </div>
  </div>
</section>
</section>
</div>
</body>
</html>
