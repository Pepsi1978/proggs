<!doctype html>
<html lang="de" data-werft-theme="darkpmcolors" data-theme="dark" style="color-scheme: dark;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfectMoment — OptionSheet — DarkPmColors (Dunkel)</title>
<link rel="stylesheet" href="../design.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.werft-screen { display: block !important; position: relative; overflow: hidden; }
</style>
</head>
<body>
<div class="werft-screens" style="width: 412px;">
<section class="werft-screen" data-screen-id="compose:OptionSheet" data-screen-name="OptionSheet" style="width: 412px; min-height: 915px;">
<section id="pm-option-screen-10" class="pm-option-screen-10" data-werft-screen="OptionSheet">
  <div class="pm-option-screen-10__underlay">
    <div class="pm-option-screen-10__breath" aria-hidden="true"></div>

    <div class="pm-option-screen-10__settings" aria-hidden="true">
      <header class="pm-option-screen-10__header">
        <button class="pm-option-screen-10__back" type="button" aria-label="Zurück" data-werft-navigate="compose:StartScreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
          </svg>
        </button>
        <div class="pm-option-screen-10__header-title">Einstellungen</div>
      </header>

      <div class="pm-option-screen-10__settings-scroll">
        <section class="pm-option-screen-10__settings-section">
          <div class="pm-option-screen-10__section-label">Ablauf</div>
          <div class="pm-option-screen-10__card">
            <button class="pm-option-screen-10__setting-row" type="button" data-werft-navigate="compose:AppBottomSheet">
              <span class="pm-option-screen-10__setting-name">Pause zwischen Wiederholungen</span>
              <span class="pm-option-screen-10__setting-value">5 s</span>
              <svg class="pm-option-screen-10__chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01z"></path>
              </svg>
            </button>
            <div class="pm-option-screen-10__divider"></div>
            <button class="pm-option-screen-10__setting-row" type="button" data-werft-navigate="compose:AppBottomSheet">
              <span class="pm-option-screen-10__setting-name">Pause bis zur nächsten Frage</span>
              <span class="pm-option-screen-10__setting-value">10 s</span>
              <svg class="pm-option-screen-10__chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01z"></path>
              </svg>
            </button>
            <div class="pm-option-screen-10__divider"></div>
            <button class="pm-option-screen-10__setting-row" type="button" data-werft-navigate="compose:AppBottomSheet">
              <span class="pm-option-screen-10__setting-name">Wiederholungen pro Frage</span>
              <span class="pm-option-screen-10__setting-value">3×</span>
              <svg class="pm-option-screen-10__chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01z"></path>
              </svg>
            </button>
            <div class="pm-option-screen-10__divider"></div>
            <button class="pm-option-screen-10__setting-row" type="button" data-werft-navigate="compose:DurationSheet">
              <span class="pm-option-screen-10__setting-name">Sitzungsdauer</span>
              <span class="pm-option-screen-10__setting-value">30 min</span>
              <svg class="pm-option-screen-10__chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01z"></path>
              </svg>
            </button>
          </div>
        </section>

        <section class="pm-option-screen-10__settings-section">
          <div class="pm-option-screen-10__section-label">Inhalt</div>
          <div class="pm-option-screen-10__card">
            <button class="pm-option-screen-10__setting-row" type="button" data-werft-navigate="compose:HooksScreen">
              <span class="pm-option-screen-10__setting-name">Gesprächsaufhänger</span>
              <svg class="pm-option-screen-10__chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01z"></path>
              </svg>
            </button>
            <div class="pm-option-screen-10__divider"></div>
            <button class="pm-option-screen-10__setting-row" type="button" data-werft-navigate="compose:SkillsScreen">
              <span class="pm-option-screen-10__setting-name">Skills</span>
              <svg class="pm-option-screen-10__chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01z"></path>
              </svg>
            </button>
            <div class="pm-option-screen-10__divider"></div>
            <div class="pm-option-screen-10__perspective-copy">
              <div class="pm-option-screen-10__perspective-text">
                <div class="pm-option-screen-10__perspective-title">Frageperspektive</div>
                <div class="pm-option-screen-10__perspective-supporting">Wie die KI ihre Fragen formuliert</div>
              </div>
            </div>
            <div class="pm-option-screen-10__segments">
              <button class="pm-option-screen-10__segment pm-option-screen-10__segment--selected" type="button">Ich-Person</button>
              <button class="pm-option-screen-10__segment" type="button">Du-Person</button>
            </div>
          </div>
        </section>

        <section class="pm-option-screen-10__settings-section">
          <div class="pm-option-screen-10__section-label">Stimme</div>
          <div class="pm-option-screen-10__card">
            <button class="pm-option-screen-10__setting-row" type="button" data-werft-navigate="compose:OptionSheet">
              <span class="pm-option-screen-10__setting-name">Anbieter</span>
              <span class="pm-option-screen-10__setting-value">Microsoft Edge</span>
              <svg class="pm-option-screen-10__chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01z"></path>
              </svg>
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <button class="pm-option-screen-10__scrim" type="button" aria-label="Auswahl schließen"></button>

  <section class="pm-option-screen-10__sheet" role="dialog" aria-modal="true" aria-labelledby="pm-option-screen-10-title">
    <div id="pm-option-screen-10-title" class="pm-option-screen-10__sheet-title">Anbieter</div>

    <div class="pm-option-screen-10__choices" role="radiogroup" aria-label="Anbieter">
      <button class="pm-option-screen-10__choice" type="button" role="radio" aria-checked="true">
        <span class="pm-option-screen-10__choice-label">Microsoft Edge</span>
        <svg class="pm-option-screen-10__check" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 16.17 4.83 12 3.41 13.41 9 19 21 7 19.59 5.59 9 16.17z"></path>
        </svg>
      </button>

      <div class="pm-option-screen-10__choice-divider"></div>

      <button class="pm-option-screen-10__choice" type="button" role="radio" aria-checked="false">
        <span class="pm-option-screen-10__choice-label">Google Chirp 3 HD</span>
        <svg class="pm-option-screen-10__check" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 16.17 4.83 12 3.41 13.41 9 19 21 7 19.59 5.59 9 16.17z"></path>
        </svg>
      </button>
    </div>
  </section>
</section>

<script>
(() => {
  const root = document.getElementById("pm-option-screen-10");
  const sheet = root.querySelector(".pm-option-screen-10__sheet");
  const scrim = root.querySelector(".pm-option-screen-10__scrim");
  const choices = [...root.querySelectorAll(".pm-option-screen-10__choice")];

  choices.forEach((choice) => {
    choice.addEventListener("click", () => {
      choices.forEach((item) => item.setAttribute("aria-checked", item === choice ? "true" : "false"));
    });
  });

  scrim.addEventListener("click", () => {
    root.classList.add("pm-option-screen-10--closed");
    window.setTimeout(() => {
      scrim.hidden = true;
      sheet.hidden = true;
    }, 300);
  });

  root.querySelectorAll(".pm-option-screen-10__segment").forEach((segment) => {
    segment.addEventListener("click", () => {
      root.querySelectorAll(".pm-option-screen-10__segment").forEach((item) => {
        item.classList.toggle("pm-option-screen-10__segment--selected", item === segment);
      });
    });
  });
})();
</script>
</section>
</div>
</body>
</html>
