<script>
(() => {
  const screen = document.querySelector(".pm-hooks-screen");
  if (!screen || screen.dataset.dragReady === "true") return;
  screen.dataset.dragReady = "true";

  const list = screen.querySelector(".pm-hooks-list");
  let state = null;

  const finishDrag = () => {
    if (!state) return;
    clearTimeout(state.timer);

    if (state.active) {
      state.card.dataset.suppressNavigationUntil = String(Date.now() + 350);
      state.card.classList.remove("pm-hooks-is-dragging");
      state.card.style.setProperty("--pm-hook-translation", "0px");
      list.classList.remove("pm-hooks-drag-active");
    }

    try {
      state.handle.releasePointerCapture(state.pointerId);
    } catch (_) {}

    state = null;
  };

  list.querySelectorAll(".pm-hooks-drag").forEach((handle) => {
    handle.addEventListener("contextmenu", (event) => event.preventDefault());

    handle.addEventListener("pointerdown", (event) => {
      if (state) finishDrag();

      const card = handle.closest(".pm-hooks-card");
      state = {
        handle,
        card,
        pointerId: event.pointerId,
        currentY: event.clientY,
        lastY: event.clientY,
        dragY: 0,
        active: false,
        timer: 0
      };

      handle.setPointerCapture(event.pointerId);
      state.timer = window.setTimeout(() => {
        if (!state || state.card !== card) return;
        state.active = true;
        state.lastY = state.currentY;
        card.classList.add("pm-hooks-is-dragging");
        list.classList.add("pm-hooks-drag-active");
      }, 500);
    });

    handle.addEventListener("pointermove", (event) => {
      if (!state || state.handle !== handle || state.pointerId !== event.pointerId) return;
      state.currentY = event.clientY;
      if (!state.active) return;

      event.preventDefault();
      state.dragY += event.clientY - state.lastY;
      state.lastY = event.clientY;

      let index = Array.prototype.indexOf.call(list.children, state.card);

      while (state.dragY > 39 && index < list.children.length - 1) {
        const next = list.children[index + 1];
        list.insertBefore(next, state.card);
        state.dragY -= 78;
        index++;
      }

      while (state.dragY < -39 && index > 0) {
        const previous = list.children[index - 1];
        list.insertBefore(state.card, previous);
        state.dragY += 78;
        index--;
      }

      state.card.style.setProperty("--pm-hook-translation", state.dragY + "px");
    });

    handle.addEventListener("pointerup", finishDrag);
    handle.addEventListener("pointercancel", finishDrag);
    handle.addEventListener("lostpointercapture", finishDrag);
  });

  list.addEventListener("click", (event) => {
    const card = event.target.closest(".pm-hooks-card");
    if (!card) return;
    const suppressUntil = Number(card.dataset.suppressNavigationUntil || 0);
    if (Date.now() < suppressUntil) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);

  list.querySelectorAll(".pm-hooks-card").forEach((card) => {
    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        card.click();
      }
    });
  });
})();
</script>
