<!doctype html>
<html lang="de" data-werft-theme="lightpmcolors" data-theme="light" style="color-scheme: light;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfectMoment — SessionScreen — LightPmColors</title>
<link rel="stylesheet" href="../design.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.werft-screen { display: block !important; position: relative; overflow: hidden; }
</style>
</head>
<body>
<div class="werft-screens" style="width: 412px;">
<section class="werft-screen" data-screen-id="compose:SessionScreen" data-screen-name="SessionScreen" style="width: 412px; min-height: 915px;">
<section class="pm17-session" id="compose-SessionScreen" aria-label="Laufende Sitzung">
  <div class="pm17-session__breath" aria-hidden="true"></div>

  <div class="pm17-session__topbar">
    <button
      class="pm17-session__speaker"
      type="button"
      aria-label="Sprachausgabe einschalten"
      disabled
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.96 8.96 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 5 9.91 7.09 12 9.18V5z"/>
      </svg>
    </button>
  </div>

  <button
    class="pm17-session__preparation-back"
    type="button"
    aria-label="Zurück"
    data-werft-navigate="compose:StartScreen"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20v-2z"/>
    </svg>
    <span>Zurück</span>
  </button>

  <div class="pm17-session__loading" role="status" aria-live="polite">
    <div class="pm17-session__loading-dots" aria-hidden="true">
      <span class="pm17-session__loading-dot"></span>
      <span class="pm17-session__loading-dot"></span>
      <span class="pm17-session__loading-dot"></span>
    </div>
    <div class="pm17-session__loading-text">Fragen werden vorbereitet…</div>
  </div>

  <button
    class="pm17-session__dimmer"
    type="button"
    aria-label="Bildschirm wieder einblenden"
  ></button>
</section>

<script>
(() => {
  const script = document.currentScript;
  const screen = script.previousElementSibling;
  const dimmer = screen.querySelector(".pm17-session__dimmer");
  let dimTimer;

  const restartDimTimer = () => {
    clearTimeout(dimTimer);
    dimTimer = setTimeout(() => {
      screen.classList.add("pm17-session--dimmed");
    }, 30000);
  };

  screen.addEventListener("pointerdown", restartDimTimer, true);

  dimmer.addEventListener("click", (event) => {
    event.stopPropagation();
    screen.classList.remove("pm17-session--dimmed");
    restartDimTimer();
  });

  restartDimTimer();
})();
</script>
</section>
</div>
</body>
</html>
