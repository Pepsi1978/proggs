<!doctype html>
<html lang="de" data-werft-theme="21dunkelstandard" data-theme="dark" style="color-scheme: dark;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="werft-render-width" content="412">
<title>Experimente-SPEC-v1 — Wünsche &amp;amp; Ziele — 2.1 Dunkel (Standard)</title>
<!--
  Die Schriften des Entwurfs — als Kopf-Verweis, nicht als @import im Stil. Ein @import ist laut
  CSS-Spezifikation nur gueltig, wenn er VOR allen anderen Regeln steht; beim Zusammenfuehren der
  Style-Bloecke zu design.css rutscht er dahinter und wird von jedem Browser STILL verworfen.
  Genau so ist ein Entwurf mit drei eigenen Schriften komplett in der Systemschrift gerendert
  worden, ohne dass irgendwo ein Fehler auftauchte.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<link rel="stylesheet" href="../design.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.werft-screen { display: block !important; position: relative; overflow: hidden; }
</style>
<!--
  Die breitenbezogenen Media Queries aus design.css, ausgewertet fuer 412 dp — die Breite,
  fuer die dieser Bildschirm entworfen wurde. Ohne diesen Block haengt das Aussehen am Fenster
  des Betrachters: eine Regel wie "max-width: 480px" greift im Studio-Geraeterahmen, im breiten
  Browserfenster aber nicht — und die Datei zeigt eine Anordnung, die es im Entwurf nie gab.
  design.css bleibt unveraendert; hier gewinnt nur, was bei 412 dp wirklich gilt.
-->
<style data-werft-aufgeloest="412">

  .werft-theme-switcher {
    display: none !important;
  }


  .werft-b01__topbar,
  .werft-b03__topbar,
  .werft-b08__topbar,
  .b09-topbar,
  .b06-topbar,
  .b07-topbar,
  .b05-topbar,
  .b04-topbar {
    padding-right: 16px;
    padding-left: 16px;
  }

  .b02-back {
    left: 8px;
  }

  .werft-b01__content {
    padding: 16px 16px 32px;
  }

  .werft-b01__date {
    margin-bottom: 20px;
  }

  .werft-b01__voice-area {
    margin-top: 20px;
  }

  .werft-b01__proposal,
  .werft-b01__experiment-card,
  .werft-b03__answer-card,
  .werft-b03__loading-card,
  .werft-b03__error-card,    .b02-bubble,
  .b05-card,
  .b04-goal-card {
    padding: 16px;
  }

  .b02-experiment-header {
    padding: 16px 16px 0;
  }

  .b02-thread {
    padding: 20px 16px 16px;
  }

  .b02-bubble {
    max-width: calc(100% - 20px);
  }

  .b02-composer {
    gap: 8px;
    padding: 16px;
  }

  .werft-b03__title {
    font-size: 22px;
    line-height: 28px;
  }

  .werft-b03__main {
    padding: 20px 16px 112px;
  }

  .werft-b08__scroll {
    padding: 16px 16px max(112px, env(safe-area-inset-bottom));
  }

  .werft-b08__field,
  .werft-b08__secret-row {
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
    row-gap: 6px;
  }

  .werft-b08__access-row {
    grid-template-columns: minmax(0, 1fr) auto;
    row-gap: 4px;
  }

  .werft-b08__access-name,
  .werft-b08__access-state {
    grid-column: 1;
  }

  .werft-b08__access-state {
    grid-row: 2;
  }

  .werft-b08__access-row .werft-b08__action {
    grid-column: 2;
    grid-row: 1 / span 2;
  }

  .werft-b08__reminder-row {
    min-height: 112px;
    grid-template-columns: minmax(0, 1fr) 48px;
    grid-template-rows: 48px 48px;
    column-gap: 12px;
    padding: 8px 12px;
  }

  .werft-b08__reminder-name {
    grid-column: 1;
    grid-row: 1;
  }

  .werft-b08__reminder-row .werft-b08__switch {
    grid-column: 2;
    grid-row: 1;
  }

  .werft-b08__reminder-row input.werft-b08__time {
    grid-column: 1 / -1;
    grid-row: 2;
    border-top: 1px solid var(--rand-weich);
  }

  .werft-b08__appearance {
    width: 100%;
  }

  .werft-b08__choice span {
    padding: 4px;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
  }

  .werft-b08__button-row,
  .werft-b03__actions,
  .b05-editor-actions,
  .b04-editor-actions {
    flex-wrap: wrap;
  }

  .b09-intro {
    right: 16px;
    left: 16px;
  }

  .b09-editor {
    right: 16px;
    left: 16px;
    width: calc(100% - 32px);
    padding: 16px;
  }

  .b09-controls {
    right: 16px;
    left: 16px;
    grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr);
    gap: 12px;
  }

  .b09-improve {
    width: 100%;
    height: auto;
    min-height: 48px;
    padding: 8px;
    font-size: 13px;
    line-height: 18px;
  }

  .b09-improve-label {
    white-space: normal;
  }

  .b06-content,
  .b07-content {
    padding-right: 16px;
    padding-left: 16px;
  }

  .b05-content,
  .b05-create-surface,
  .b04-content,
  .b04-create-layer {
    padding-right: 16px;
    padding-left: 16px;
  }

  .werft-b01__nav-item,
  .b06-nav-item,
  .b07-nav-item,
  .b05-nav-item,
  .b04-nav-label {
    gap: 2px;
    font-size: 12px;
    line-height: 18px;
    letter-spacing: 0;
  }

</style>
</head>
<body>
<div class="werft-screens" style="width: 412px;">
<section class="werft-screen" data-screen-id="B-04" data-screen-name="Wünsche &amp; Ziele" style="width: 1440px; min-height: 900px;">
<section class="b04-screen" data-screen-id="B-04" aria-labelledby="b04-title">
  <header class="b04-topbar">
    <h1 class="b04-title" id="b04-title">Wünsche &amp; Ziele</h1>
  </header>

  <main class="b04-content">
    <p class="b04-intro">Was möchtest du erreichen? Die Vorschläge tasten dich Schritt für Schritt heran.</p>

    <section class="b04-goals" aria-label="Ziele">
      <p class="b04-empty">Noch keine Ziele. Sprich das erste ein.</p>
    </section>
  </main>

  <section class="b04-create-layer" aria-label="Ziel anlegen" hidden>
    <div class="b04-record-state">
      <div class="b04-mic-wrap">
        <span class="b04-record-ring" aria-hidden="true"></span>
        <button class="b04-mic" type="button" data-werft-funktion="F-20" aria-label="Ziel einsprechen">
          <svg class="b04-icon b04-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14q-1.25 0-2.125-.875T9 11V5q0-1.25.875-2.125T12 2q1.25 0 2.125.875T15 5v6q0 1.25-.875 2.125T12 14Zm-1 7v-3.075q-2.6-.35-4.3-2.325Q5 13.625 5 11h2q0 2.075 1.463 3.538Q9.925 16 12 16t3.538-1.462Q17 13.075 17 11h2q0 2.625-1.7 4.6-1.7 1.975-4.3 2.325V21h-2Z"/>
          </svg>
        </button>
      </div>
      <output class="b04-record-time" aria-live="polite" hidden>00:00</output>
    </div>

    <div class="b04-editor" hidden>
      <textarea class="b04-goal-input" aria-label="Ziel" data-werft-funktion="F-20"></textarea>
      <div class="b04-editor-actions">
        <button class="b04-text-button" type="button" data-werft-funktion="F-02">Text mit KI verbessern</button>
        <button class="b04-action-button" type="button" data-werft-funktion="F-20">Speichern</button>
      </div>
    </div>
  </section>

  <button class="b04-fab" type="button" data-werft-funktion="F-20" aria-label="Ziel anlegen" aria-expanded="false">
    <svg class="b04-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M11 19v-6H5v-2h6V5h2v6h6v2h-6v6Z"/>
    </svg>
  </button>

  <nav class="b04-bottom-nav werft-primary-nav" aria-label="Hauptnavigation">
    <button class="b04-nav-item" type="button" data-werft-navigate="B-01">
      <svg class="b04-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#werft-nav-heute"></use></svg>
      <span class="b04-nav-label">Heute</span>
    </button>

    <button class="b04-nav-item is-active" type="button" data-werft-navigate="B-04" aria-current="page">
      <svg class="b04-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#werft-nav-ziele"></use></svg>
      <span class="b04-nav-label">Ziele</span>
    </button>

    <button class="b04-nav-item" type="button" data-werft-navigate="B-05">
      <svg class="b04-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#werft-nav-merkliste"></use></svg>
      <span class="b04-nav-label">Merkliste</span>
    </button>

    <button class="b04-nav-item" type="button" data-werft-navigate="B-06">
      <svg class="b04-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#werft-nav-erkenntnisse"></use></svg>
      <span class="b04-nav-label">Erkenntnisse</span>
    </button>

    <button class="b04-nav-item" type="button" data-werft-navigate="B-07">
      <svg class="b04-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#werft-nav-logbuch"></use></svg>
      <span class="b04-nav-label">Logbuch</span>
    </button>
  </nav>
</section>

<script>
  (() => {
    const screen = document.currentScript.previousElementSibling;
    if (!screen || !screen.classList.contains("b04-screen")) return;

    const fab = screen.querySelector(".b04-fab");
    const layer = screen.querySelector(".b04-create-layer");
    const recordState = screen.querySelector(".b04-record-state");
    const mic = screen.querySelector(".b04-mic");
    const micIcon = screen.querySelector(".b04-mic-icon");
    const timerOutput = screen.querySelector(".b04-record-time");
    const editor = screen.querySelector(".b04-editor");
    const input = screen.querySelector(".b04-goal-input");
    const improve = screen.querySelector(".b04-text-button");
    const save = screen.querySelector(".b04-action-button");
    const goals = screen.querySelector(".b04-goals");
    const empty = screen.querySelector(".b04-empty");

    const micPath = "M12 14q-1.25 0-2.125-.875T9 11V5q0-1.25.875-2.125T12 2q1.25 0 2.125.875T15 5v6q0 1.25-.875 2.125T12 14Zm-1 7v-3.075q-2.6-.35-4.3-2.325Q5 13.625 5 11h2q0 2.075 1.463 3.538Q9.925 16 12 16t3.538-1.462Q17 13.075 17 11h2q0 2.625-1.7 4.6-1.7 1.975-4.3 2.325V21h-2Z";
    const stopPath = "M6 18V6h12v12H6Z";

    let recording = false;
    let timer = null;
    let startedAt = 0;
    let editingCard = null;

    const vibrateConfirm = () => {
      if (navigator.vibrate) navigator.vibrate(20);
    };

    const resetRecorder = () => {
      recording = false;
      clearInterval(timer);
      timer = null;
      recordState.classList.remove("is-recording");
      timerOutput.hidden = true;
      timerOutput.textContent = "00:00";
      micIcon.querySelector("path").setAttribute("d", micPath);
      mic.setAttribute("aria-label", "Ziel einsprechen");
      editor.hidden = true;
      recordState.hidden = false;
      input.value = "";
      improve.textContent = "Text mit KI verbessern";
      editingCard = null;
    };

    const openEditor = (card = null) => {
      clearInterval(timer);
      timer = null;
      recording = false;
      recordState.classList.remove("is-recording");
      recordState.hidden = true;
      editor.hidden = false;
      editingCard = card;
      input.value = card ? card.querySelector(".b04-goal-text").textContent : "";
      improve.textContent = "Text mit KI verbessern";
      input.focus();
    };

    fab.addEventListener("click", () => {
      const opening = layer.hidden;
      layer.hidden = !opening;
      fab.setAttribute("aria-expanded", String(opening));
      if (opening) resetRecorder();
      else {
        clearInterval(timer);
        timer = null;
        recording = false;
      }
    });

    mic.addEventListener("click", () => {
      vibrateConfirm();

      if (!recording) {
        recording = true;
        startedAt = Date.now();
        recordState.classList.add("is-recording");
        timerOutput.hidden = false;
        micIcon.querySelector("path").setAttribute("d", stopPath);
        mic.setAttribute("aria-label", "Aufnahme beenden");

        timer = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startedAt) / 1000);
          const minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");
          const seconds = String(elapsed % 60).padStart(2, "0");
          timerOutput.textContent = `${minutes}:${seconds}`;
        }, 250);
      } else {
        openEditor();
      }
    });

    improve.addEventListener("click", () => {
      if (!input.value.trim()) {
        input.focus();
        return;
      }

      improve.textContent =
        improve.textContent === "Text mit KI verbessern"
          ? "Zurücknehmen"
          : "Text mit KI verbessern";
    });

    const installCardInteractions = card => {
      let longPressTimer = null;
      let longPressed = false;

      card.addEventListener("click", () => {
        if (longPressed) {
          longPressed = false;
          return;
        }
        layer.hidden = false;
        fab.setAttribute("aria-expanded", "true");
        openEditor(card);
      });

      card.addEventListener("pointerdown", () => {
        longPressed = false;
        longPressTimer = setTimeout(() => {
          longPressed = true;
          card.remove();
          if (!goals.querySelector(".b04-goal-card")) empty.hidden = false;
        }, 550);
      });

      ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
        card.addEventListener(type, () => clearTimeout(longPressTimer));
      });

      card.addEventListener("contextmenu", event => {
        event.preventDefault();
        card.remove();
        if (!goals.querySelector(".b04-goal-card")) empty.hidden = false;
      });

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          card.click();
        }

        if (event.key === "Delete") {
          card.remove();
          if (!goals.querySelector(".b04-goal-card")) empty.hidden = false;
        }
      });
    };

    save.addEventListener("click", () => {
      const value = input.value.trim();
      if (!value) {
        input.focus();
        return;
      }

      if (editingCard) {
        editingCard.querySelector(".b04-goal-text").textContent = value;
      } else {
        const card = document.createElement("article");
        card.className = "b04-goal-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("data-werft-funktion", "F-20");
        card.setAttribute("aria-label", "Ziel bearbeiten; langer Druck löscht das Ziel");

        const text = document.createElement("p");
        text.className = "b04-goal-text";
        text.textContent = value;

        const date = document.createElement("time");
        date.className = "b04-goal-date";
        const now = new Date();
        date.dateTime = now.toISOString().slice(0, 10);
        date.textContent = new Intl.DateTimeFormat("de-DE", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }).format(now);

        card.append(text, date);
        goals.append(card);
        installCardInteractions(card);
        empty.hidden = true;
      }

      resetRecorder();
    });
  })();
</script>
</section>
</div>
</body>
</html>
