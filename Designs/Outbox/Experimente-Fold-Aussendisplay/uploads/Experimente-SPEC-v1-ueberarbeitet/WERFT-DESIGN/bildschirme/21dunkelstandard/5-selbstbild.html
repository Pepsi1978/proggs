<!doctype html>
<html lang="de" data-werft-theme="21dunkelstandard" data-theme="dark" style="color-scheme: dark;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="werft-render-width" content="412">
<title>Experimente-SPEC-v1 — Selbstbild — 2.1 Dunkel (Standard)</title>
<!--
  Die Schriften des Entwurfs — als Kopf-Verweis, nicht als @import im Stil. Ein @import ist laut
  CSS-Spezifikation nur gueltig, wenn er VOR allen anderen Regeln steht; beim Zusammenfuehren der
  Style-Bloecke zu design.css rutscht er dahinter und wird von jedem Browser STILL verworfen.
  Genau so ist ein Entwurf mit drei eigenen Schriften komplett in der Systemschrift gerendert
  worden, ohne dass irgendwo ein Fehler auftauchte.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<link rel="stylesheet" href="../design.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.werft-screen { display: block !important; position: relative; overflow: hidden; }
</style>
<!--
  Die breitenbezogenen Media Queries aus design.css, ausgewertet fuer 412 dp — die Breite,
  fuer die dieser Bildschirm entworfen wurde. Ohne diesen Block haengt das Aussehen am Fenster
  des Betrachters: eine Regel wie "max-width: 480px" greift im Studio-Geraeterahmen, im breiten
  Browserfenster aber nicht — und die Datei zeigt eine Anordnung, die es im Entwurf nie gab.
  design.css bleibt unveraendert; hier gewinnt nur, was bei 412 dp wirklich gilt.
-->
<style data-werft-aufgeloest="412">

  .werft-theme-switcher {
    display: none !important;
  }


  .werft-b01__topbar,
  .werft-b03__topbar,
  .werft-b08__topbar,
  .b09-topbar,
  .b06-topbar,
  .b07-topbar,
  .b05-topbar,
  .b04-topbar {
    padding-right: 16px;
    padding-left: 16px;
  }

  .b02-back {
    left: 8px;
  }

  .werft-b01__content {
    padding: 16px 16px 32px;
  }

  .werft-b01__date {
    margin-bottom: 20px;
  }

  .werft-b01__voice-area {
    margin-top: 20px;
  }

  .werft-b01__proposal,
  .werft-b01__experiment-card,
  .werft-b03__answer-card,
  .werft-b03__loading-card,
  .werft-b03__error-card,    .b02-bubble,
  .b05-card,
  .b04-goal-card {
    padding: 16px;
  }

  .b02-experiment-header {
    padding: 16px 16px 0;
  }

  .b02-thread {
    padding: 20px 16px 16px;
  }

  .b02-bubble {
    max-width: calc(100% - 20px);
  }

  .b02-composer {
    gap: 8px;
    padding: 16px;
  }

  .werft-b03__title {
    font-size: 22px;
    line-height: 28px;
  }

  .werft-b03__main {
    padding: 20px 16px 112px;
  }

  .werft-b08__scroll {
    padding: 16px 16px max(112px, env(safe-area-inset-bottom));
  }

  .werft-b08__field,
  .werft-b08__secret-row {
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
    row-gap: 6px;
  }

  .werft-b08__access-row {
    grid-template-columns: minmax(0, 1fr) auto;
    row-gap: 4px;
  }

  .werft-b08__access-name,
  .werft-b08__access-state {
    grid-column: 1;
  }

  .werft-b08__access-state {
    grid-row: 2;
  }

  .werft-b08__access-row .werft-b08__action {
    grid-column: 2;
    grid-row: 1 / span 2;
  }

  .werft-b08__reminder-row {
    min-height: 112px;
    grid-template-columns: minmax(0, 1fr) 48px;
    grid-template-rows: 48px 48px;
    column-gap: 12px;
    padding: 8px 12px;
  }

  .werft-b08__reminder-name {
    grid-column: 1;
    grid-row: 1;
  }

  .werft-b08__reminder-row .werft-b08__switch {
    grid-column: 2;
    grid-row: 1;
  }

  .werft-b08__reminder-row input.werft-b08__time {
    grid-column: 1 / -1;
    grid-row: 2;
    border-top: 1px solid var(--rand-weich);
  }

  .werft-b08__appearance {
    width: 100%;
  }

  .werft-b08__choice span {
    padding: 4px;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
  }

  .werft-b08__button-row,
  .werft-b03__actions,
  .b05-editor-actions,
  .b04-editor-actions {
    flex-wrap: wrap;
  }

  .b09-intro {
    right: 16px;
    left: 16px;
  }

  .b09-editor {
    right: 16px;
    left: 16px;
    width: calc(100% - 32px);
    padding: 16px;
  }

  .b09-controls {
    right: 16px;
    left: 16px;
    grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr);
    gap: 12px;
  }

  .b09-improve {
    width: 100%;
    height: auto;
    min-height: 48px;
    padding: 8px;
    font-size: 13px;
    line-height: 18px;
  }

  .b09-improve-label {
    white-space: normal;
  }

  .b06-content,
  .b07-content {
    padding-right: 16px;
    padding-left: 16px;
  }

  .b05-content,
  .b05-create-surface,
  .b04-content,
  .b04-create-layer {
    padding-right: 16px;
    padding-left: 16px;
  }

  .werft-b01__nav-item,
  .b06-nav-item,
  .b07-nav-item,
  .b05-nav-item,
  .b04-nav-label {
    gap: 2px;
    font-size: 12px;
    line-height: 18px;
    letter-spacing: 0;
  }

</style>
</head>
<body>
<div class="werft-screens" style="width: 412px;">
<section class="werft-screen" data-screen-id="B-09" data-screen-name="Selbstbild" style="width: 1440px; min-height: 900px;">
<section class="b09-screen" data-werft-screen="B-09" aria-labelledby="b09-title">
  <header class="b09-topbar">
    <button
      class="b09-back"
      type="button"
      aria-label="Zurück zu Einstellungen"
      data-werft-navigate="B-08"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11H7.83l5.59-5.59c.39-.39.39-1.03 0-1.42-.39-.39-1.03-.39-1.42 0l-7.29 7.3c-.39.39-.39 1.02 0 1.41L12 20c.39.39 1.03.39 1.42 0 .39-.39.39-1.03 0-1.42L7.83 13H20c.55 0 1-.45 1-1s-.45-1-1-1z"/>
      </svg>
    </button>
    <h1 class="b09-title" id="b09-title">Selbstbild</h1>
  </header>

  <main class="b09-content">
    <p class="b09-intro">
      Alles, was die App dauerhaft über dich wissen soll.<br>
      Je mehr hier steht, desto genauer treffen die Vorschläge.
    </p>

    <textarea
      class="b09-editor"
      aria-label="Selbstbild"
      data-werft-funktion="F-21"
      placeholder="Wer bist du? Was prägt dich? Was war?&#10;Sprich einfach drauflos."
      spellcheck="true"
    ></textarea>

    <div class="b09-controls">
      <button
        class="b09-improve"
        type="button"
        aria-pressed="false"
        data-werft-funktion="F-02"
      >
        <span class="b09-improve-label">Text mit KI verbessern</span>
      </button>

      <div class="b09-mic-wrap">
        <span class="b09-mic-ring" aria-hidden="true"></span>
        <button
          class="b09-mic-button"
          type="button"
          aria-label="Selbstbild einsprechen"
          aria-pressed="false"
          data-werft-funktion="F-21"
        >
          <svg class="b09-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
          </svg>
          <svg class="b09-stop-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 19q-.825 0-1.413-.588T6 17V7q0-.825.587-1.413T8 5h8q.825 0 1.413.587T18 7v10q0 .825-.587 1.412T16 19H8Z"/>
          </svg>
        </button>
      </div>

      <span aria-hidden="true"></span>
    </div>
  </main>

  <script>
    (() => {
      const screen = document.currentScript.closest(".b09-screen");
      const editor = screen.querySelector(".b09-editor");
      const improve = screen.querySelector(".b09-improve");
      const improveLabel = screen.querySelector(".b09-improve-label");
      const micWrap = screen.querySelector(".b09-mic-wrap");
      const micButton = screen.querySelector(".b09-mic-button");
      const backButton = screen.querySelector(".b09-back");
      const storageKey = "werft-experimente-selbstbild";

      try {
        editor.value = localStorage.getItem(storageKey) || "";
      } catch (_) {}

      const save = () => {
        try {
          localStorage.setItem(storageKey, editor.value);
        } catch (_) {}
      };

      editor.addEventListener("input", save);
      backButton.addEventListener("click", save);
      window.addEventListener("pagehide", save);

      improve.addEventListener("click", () => {
        const improved = improve.getAttribute("aria-pressed") === "true";
        improve.setAttribute("aria-pressed", String(!improved));
        improveLabel.textContent = improved
          ? "Text mit KI verbessern"
          : "Zurücknehmen";
      });

      micButton.addEventListener("click", () => {
        const recording = micWrap.classList.toggle("is-recording");
        micButton.setAttribute("aria-pressed", String(recording));
        micButton.setAttribute(
          "aria-label",
          recording ? "Aufnahme stoppen" : "Selbstbild einsprechen"
        );
      });
    })();
  </script>
</section>
</section>
</div>
</body>
</html>
