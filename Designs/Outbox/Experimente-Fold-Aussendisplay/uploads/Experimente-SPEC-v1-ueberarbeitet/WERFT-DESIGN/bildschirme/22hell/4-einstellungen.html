<!doctype html>
<html lang="de" data-werft-theme="22hell" data-theme="light" style="color-scheme: light;">
<head>
<meta charset="utf-8">

<meta name="werft-render-width" content="412">
<title>Experimente-SPEC-v1 — Einstellungen — 2.2 Hell</title>
<!--
  Die Schriften des Entwurfs — als Kopf-Verweis, nicht als @import im Stil. Ein @import ist laut
  CSS-Spezifikation nur gueltig, wenn er VOR allen anderen Regeln steht; beim Zusammenfuehren der
  Style-Bloecke zu design.css rutscht er dahinter und wird von jedem Browser STILL verworfen.
  Genau so ist ein Entwurf mit drei eigenen Schriften komplett in der Systemschrift gerendert
  worden, ohne dass irgendwo ein Fehler auftauchte.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<link rel="stylesheet" href="../design.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.werft-screen { display: block !important; position: relative; overflow: hidden; }
</style>
<!--
  Die breitenbezogenen Media Queries aus design.css, ausgewertet fuer 412 dp — die Breite,
  fuer die dieser Bildschirm entworfen wurde. Ohne diesen Block haengt das Aussehen am Fenster
  des Betrachters: eine Regel wie "max-width: 480px" greift im Studio-Geraeterahmen, im breiten
  Browserfenster aber nicht — und die Datei zeigt eine Anordnung, die es im Entwurf nie gab.
  design.css bleibt unveraendert; hier gewinnt nur, was bei 412 dp wirklich gilt.
-->
<style data-werft-aufgeloest="412">

  }

  .werft-b01__content {

  .b05-card,

  .b02-experiment-header {

  }

  .b02-bubble {

  .b02-composer {

  }

  .werft-b03__title {
    font-size: 22px;

  }

  .werft-b03__main {
    padding: 20px 16px 112px;
  }

  .werft-b08__scroll {
    padding: 16px 16px max(112px, env(safe-area-inset-bottom));
  }

  .werft-b08__field,
  .werft-b08__secret-row {
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
    row-gap: 6px;
  }

  .werft-b08__access-row {

  }

  .werft-b08__reminder-row {

</style>

<body>

<script>
  (() => {
    const root = document.getElementById("werft-b08-screen");
    if (!root) return;

    const provider = root.querySelector("#werft-b08-provider");
    const voicePanels = root.querySelectorAll("[data-provider-panel]");

    const updateVoicePanel = () => {
      voicePanels.forEach((panel) => {
        panel.hidden = panel.getAttribute("data-provider-panel") !== provider.value;
      });
    };

    provider.addEventListener("change", updateVoicePanel);
    updateVoicePanel();

    const rate = root.querySelector("#werft-b08-rate");
    const rateValue = root.querySelector("#werft-b08-rate-value");
    rate.addEventListener("input", () => {
      const value = Number(rate.value);
      rateValue.textContent = value.toFixed(2).replace(".", ",");
    });

    const preview = root.querySelector("#werft-b08-preview");
    preview.addEventListener("click", () => {
      const active = preview.getAttribute("aria-pressed") !== "true";
      preview.setAttribute("aria-pressed", String(active));
      preview.classList.toggle("is-active", active);
    });

    const recordVoice = root.querySelector("#werft-b08-record-voice");
    recordVoice.addEventListener("click", () => {
      const active = recordVoice.getAttribute("aria-pressed") !== "true";
      recordVoice.setAttribute("aria-pressed", String(active));
      recordVoice.classList.toggle("is-active", active);
    });

    const codexButton = root.querySelector("#werft-b08-codex-button");
    const codexState = root.querySelector("#werft-b08-codex-state");

    codexButton.addEventListener("click", () => {
      const signedIn = codexButton.getAttribute("aria-pressed") !== "true";
      codexButton.setAttribute("aria-pressed", String(signedIn));
      codexButton.classList.toggle("is-active", signedIn);
      codexState.textContent = signedIn ? "angemeldet" : "nicht angemeldet";
      codexButton.querySelector("span").textContent = signedIn ? "Abmelden" : "Anmelden";
    });

    const reminderRows = [...root.querySelectorAll(".werft-b08__reminder-row")];
    reminderRows.forEach((row, index) => {
      const toggle = row.querySelector('.werft-b08__switch input[type="checkbox"]');
      const timeInput = row.querySelector("input.werft-b08__time");
      const reminderKey = index === 0 ? "morning" : "evening";
      const enabledStorageKey = `experimente-reminder-${reminderKey}-on`;
      const timeStorageKey = `experimente-reminder-${reminderKey}-time`;

      try {
        const storedEnabled = localStorage.getItem(enabledStorageKey);
        const storedTime = localStorage.getItem(timeStorageKey);
        if (storedEnabled !== null) toggle.checked = storedEnabled === "true";
        if (storedTime) timeInput.value = storedTime;
      } catch (_) {}

      toggle.addEventListener("change", () => {
        try {
          localStorage.setItem(enabledStorageKey, String(toggle.checked));
        } catch (_) {}
      });

      timeInput.addEventListener("input", () => {
        try {
          localStorage.setItem(timeStorageKey, timeInput.value);
        } catch (_) {}
      });

      const switchLabel = row.querySelector(".werft-b08__switch");
      switchLabel.addEventListener("click", (event) => {
        if (event.target === toggle) return;
        event.preventDefault();
        toggle.checked = !toggle.checked;
        toggle.dispatchEvent(new Event("change", { bubbles: true }));
      });
    });
  })();
</script>
</section>
