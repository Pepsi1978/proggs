    case 'search': return el('svg',p, CI(11,11,6.4), P('M20 20l-3.7-3.7'));
    case 'volume': return el('svg',p, P('M4 9.5v5h3.3L12 18.2V5.8L7.3 9.5H4z'), P('M15.4 8.6a5 5 0 0 1 0 6.8'), P('M18 6a8.5 8.5 0 0 1 0 12'));

    case 'undo': return el('svg',p, P('M9 7L5 11l4 4'), P('M5 11h8.5a4.8 4.8 0 0 1 0 9.6H12'));
    case 'reset': return el('svg',p, P('M20 12a8 8 0 1 1-2.6-5.9'), P('M20 4v4h-4'));
    case 'trash': return el('svg',p, P('M5 7h14'), P('M9 7V5.6A1.6 1.6 0 0 1 10.6 4h2.8A1.6 1.6 0 0 1 15 5.6V7'), P('M6.6 7l.7 12A1.6 1.6 0 0 0 8.9 20.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.4 7'), P('M10 11v6M14 11v6'));

    case 'flip': return el('svg',p, P('M4 9a8 8 0 0 1 13.5-3.3L20 8'), P('M20 4.5V8h-3.5'), P('M20 15a8 8 0 0 1-13.5 3.3L4 16'), P('M4 19.5V16h3.5'));
    case 'cards': return el('svg',p, RC(3,7.5,12,13.5,2.2), P('M8 7.5V6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2h-1.5'));
    case 'lock': return el('svg',p, RC(4.5,10.2,15,9.8,2.4), P('M8 10.2V7.6a4 4 0 0 1 8 0v2.6'));
    case 'key': return el('svg',p, CI(8,8,4.2), P('M11 11l8.5 8.5'), P('M16.5 16.5l1.8-1.8'), P('M19 14l1.7 1.7'));
    case 'wifi': return el('svg',p, P('M2.5 8.6a15 15 0 0 1 19 0'), P('M5.6 12a10 10 0 0 1 12.8 0'), P('M8.6 15.4a5 5 0 0 1 6.8 0'), CI(12,19,0.9,fill));

    default: return null;

}

class Component extends DCLogic {
  constructor(p){
    super(p);
    this.state = {
      tab:'recherche', themeOverride:null, profDark:0, profLight:0, openai:{connected:false,email:null}, showOAuth:false,
      mic:'idle', recSecs:0, input:'', versions:[''], vIndex:0, improving:false,
      answer:null, answerLen:0, genPhase:null, saved:false, showCross:false, crossDone:false,
      model:'GPT 5.6 Terra', reasoning:'Mittel', showModel:false,
      detail:null, detailTab:'karten',
      learn:null,
      cards:CARDS.map(c=>({...c})),
      set:{ sounds:true, vol:0.6, ev:{flip:true,known:true,unknown:true,trans:true,done:true},
            voice:'Seraphina (Multilingual)', rate:1, cardFont:20 },
      cross:[{title:'Drohnen-Recht in der EU', n:6, done:null},{title:'Cold Exposure & Vagusnerv', n:3, done:null}],
    };
    this.ac=null;
  }
  pal(){ const mode=this.state.themeOverride||this.props.theme||'dark'; const idx=mode==='dark'?this.state.profDark:this.state.profLight; const p=PROFILES[mode][idx]||PROFILES[mode][0]; return {name:mode, profileLabel:p.label, ...BASE[mode], ...p}; }

  // ---------- SOUND ----------
  ctx(){ if(!this.ac){ try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ac&&this.ac.state==='suspended') this.ac.resume(); return this.ac; }
  sfx(name){
    const s=this.state.set; if(!s.sounds||!s.ev[name==='knownS'?'known':name]) {}
    if(!s.sounds) return; const map={flip:'flip',known:'known',unknown:'unknown',trans:'trans',done:'done'};
    if(!s.ev[map[name]]) return;
    const ac=this.ctx(); if(!ac) return; const t=ac.currentTime; const vol=s.vol;
    const tone=(f0,f1,dur,type,g,delay=0)=>{ const o=ac.createOscillator(),ga=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f0,t+delay); if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+delay+dur); ga.gain.setValueAtTime(0,t+delay); ga.gain.linearRampToValueAtTime((g||0.2)*vol,t+delay+0.012); ga.gain.exponentialRampToValueAtTime(0.0001,t+delay+dur); o.connect(ga).connect(ac.destination); o.start(t+delay); o.stop(t+delay+dur+0.05); };
    const noise=(dur,cut,g,delay=0)=>{ const b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length); const src=ac.createBufferSource();src.buffer=b; const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=cut; const ga=ac.createGain();ga.gain.value=(g||0.15)*vol; src.connect(bp).connect(ga).connect(ac.destination); src.start(t+delay); };
    if(name==='flip'){ noise(0.14,1400,0.14); tone(150,90,0.13,'sine',0.16); }
    else if(name==='known'){ tone(587,0,0.14,'sine',0.16); tone(880,0,0.22,'sine',0.16,0.09); tone(1175,0,0.3,'triangle',0.09,0.17); }
    else if(name==='unknown'){ tone(320,190,0.28,'sine',0.18); noise(0.12,500,0.06); }
    else if(name==='trans'){ noise(0.26,900,0.05); tone(420,700,0.2,'sine',0.05); }
    else if(name==='done'){ [523,659,784,1046,1319].forEach((f,i)=>tone(f,0,0.5,'triangle',0.13,i*0.1)); }
  }

  // ---------- MIC ----------
  startRec(){ this.ctx(); this.setState({mic:'recording',recSecs:0}); this.recT=setInterval(()=>this.setState(s=>({recSecs:s.recSecs+1})),1000); }
  stopRec(){ clearInterval(this.recT); this.setState({mic:'transcribing'}); this.sfx('trans'); setTimeout(()=>{ const v=[RAW]; this.setState({mic:'idle',input:RAW,versions:v,vIndex:0}); },1500); }

  // ---------- IMPROVE ----------
  improve(){ if(this.state.improving||!this.state.input.trim())return; this.setState({improving:true}); this.ctx();
    setTimeout(()=>{ this.setState(s=>{ const base=s.versions[0]||s.input; const used=s.versions.length-1; const next=IMPROVED[used%IMPROVED.length]; const versions=s.versions[0]===base?[...s.versions]:[base]; versions.push(next); return {versions, vIndex:versions.length-1, input:next, improving:false}; }); this.sfx('flip'); },1100); }
  undo(){ this.setState(s=>{ if(s.vIndex<=0)return{}; const i=s.vIndex-1; return {vIndex:i, input:s.versions[i]}; }); }

  // ---------- SEND ----------
  send(){ if(!this.state.input.trim()||this.state.genPhase)return; this.ctx();
    this.setState({answer:'',answerLen:0,genPhase:'answer',saved:false,showCross:false,crossDone:false});
    const words=ANSWER.split(' '); let i=0;
    this.genT=setInterval(()=>{ i+=2; this.setState({answerLen:i, answer:words.slice(0,i).join(' ')}); if(i>=words.length){ clearInterval(this.genT); this.setState({answer:ANSWER,genPhase:'cards'}); setTimeout(()=>{ this.setState({genPhase:'done',saved:true}); setTimeout(()=>this.setState({showCross:true}),700); },1700); } },55);
  }
  resetRecherche(){ this.setState({input:'',versions:[''],vIndex:0,answer:null,genPhase:null,saved:false,showCross:false,crossDone:false,mic:'idle'}); }

  // ---------- TTS ----------
  speak(txt){ try{ const u=new SpeechSynthesisUtterance(txt); u.lang='de-DE'; u.rate=this.state.set.rate; const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('de')); if(vs[0])u.voice=vs[0]; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

  // ---------- LEARN ----------
  openLearn(deck){ this.ctx(); const idx=deck.map((_,i)=>i); this.setState({learn:{deck,queue:idx,pos:0,flipped:false,anim:'in',known:0,total:deck.length,results:{k:0,u:0},done:false}}); this.sfx('trans'); setTimeout(()=>this.setState(s=>({learn:{...s.learn,anim:'idle'}})),420); }
  flip(){ this.setState(s=>({learn:{...s.learn,flipped:!s.learn.flipped}})); this.sfx('flip'); }
  rate(known){ const L=this.state.learn; if(L.anim!=='idle'&&L.anim!=='in')return; this.sfx(known?'known':'unknown');
    this.setState(s=>({learn:{...s.learn,anim:known?'fly-k':'fly-u',results:{k:s.learn.results.k+(known?1:0),u:s.learn.results.u+(known?0:1)}}}));
    setTimeout(()=>{ this.setState(s=>{ const L=s.learn; let q=[...L.queue]; const cur=q[L.pos]; if(!known)q.push(cur); const pos=L.pos+1; const known2=L.known+(known?1:0);
      if(pos>=q.length){ this.sfx('done'); return {learn:{...L,queue:q,pos,known:known2,done:true}}; }
      return {learn:{...L,queue:q,pos,known:known2,flipped:false,anim:'in'}}; });
      setTimeout(()=>this.setState(s=>s.learn&&!s.learn.done?({learn:{...s.learn,anim:'idle'}}):{}),380);
    }, known?520:560);
  }
  closeLearn(){ this.setState({learn:null}); try{speechSynthesis.cancel();}catch(e){} }
  restartLearn(){ const d=this.state.learn.deck; this.openLearn(d); }

  set(path,val){ this.setState(s=>{ const set={...s.set}; if(path.startsWith('ev.')){ set.ev={...set.ev,[path.slice(3)]:val}; } else set[path]=val; return {set}; }); }

  // ================= RENDER PIECES =================

      el('button',{onClick:()=>this.setState({showModel:true}),style:{display:'flex',alignItems:'center',gap:8,background:c.surface,backdropFilter:'blur(18px)',WebkitBackdropFilter:'blur(18px)',border:`1px solid ${c.border}`,borderRadius:99,padding:'8px 12px',cursor:'pointer'}},

        el('div',{style:{textAlign:'left',lineHeight:1.1}},
          el('div',{style:{fontSize:12.5,fontWeight:700,color:c.text}},s.model),
          el('div',{style:{fontSize:10.5,color:c.faint,fontWeight:500}},'Reasoning · '+s.reasoning))));

  micBtn(c){ const m=this.state.mic;
