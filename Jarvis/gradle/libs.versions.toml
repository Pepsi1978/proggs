[versions]
agp = "8.7.3"
kotlin = "2.1.0"
composeBom = "2025.01.01"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
okhttp = "4.12.0"
securityCrypto = "1.1.0-alpha06"
