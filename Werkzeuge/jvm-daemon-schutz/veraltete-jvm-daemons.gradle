// Beendet vor jedem Gradle-Build Kotlin-Compile-Daemons, deren JDK es nicht mehr gibt.
//
// Hintergrund (21.10.2026): Homebrew löscht bei einem JDK-Update den alten Ordner
// (/opt/homebrew/Cellar/openjdk@17/17.0.20.1 → 17.0.21). Ein Kotlin-Compile-Daemon, der vorher
// gestartet war, läuft weiter, wird von neuen Builds wiederverwendet und bricht dann mit
// „no class roots are found in the JDK path: …/17.0.20.1/…“ ab. `gradlew --stop` beendet ihn nicht.
// Gleiche Erkennung wie VeralteteDaemons.java: die tatsächlich laufende Java-Datei existiert nicht mehr.
//
// Installiert von Werkzeuge/jvm-daemon-schutz/aufraeumen.sh nach ~/.gradle/init.d/. Bei einem Treffer des
// Configuration Cache läuft es nicht; dafür gibt es den launchd-Wächter und die Updater-Zentrale.
// Darf einen Build nie stören: jeder Fehler wird nur geloggt.
try {
    ProcessHandle.allProcesses().each { p ->
        def info = p.info()
        def java = info.command().orElse("")
        if (!java.endsWith("/bin/java") && !java.endsWith("\\bin\\java.exe")) return
        if (new File(java).exists()) return
        if (!info.commandLine().orElse("").contains("KotlinCompileDaemon")) return
        if (p.destroy()) {
            logger.warn("JDK-Schutz: veralteten Kotlin-Daemon ${p.pid()} beendet (${java} existiert nicht mehr).")
        }
    }
} catch (Throwable fehler) {
    logger.warn("JDK-Schutz: Prüfung der Kotlin-Daemons fehlgeschlagen: ${fehler}")
}
