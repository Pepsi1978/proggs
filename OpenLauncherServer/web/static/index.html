<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Server-Konsole</title>
<link rel="stylesheet" href="/static/xterm.css?v=5.5.0">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/designs.js"></script>
<script>
// Thema vor dem ersten Zeichnen setzen: Sonst blitzt die Seite bei Hell erst dunkel auf. app.js nutzt window.Thema weiter.
(() => {
  const ERLAUBT = ["auto", "hell", "dunkel"];
  const BREITE = 52.52, LAENGE = 13.405, rad = Math.PI / 180;
  let wahl = "auto";
  try { const w = localStorage.getItem("thema"); if (ERLAUBT.includes(w)) wahl = w; } catch { /* nur Komfort */ }
  // Sonnenaufgangsgleichung (NOAA, auf wenige Minuten genau) für den Berliner Kalendertag, egal in welcher Zeitzone das Gerät steht.
  function sonne(jetzt) {
    const [j0, m0, t0] = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin", year: "numeric", month: "2-digit", day: "2-digit" }).format(jetzt).split("-").map(Number);
    const n = Math.round(Date.UTC(j0, m0 - 1, t0, 12) / 864e5 + 2440587.5 - 2451545.0008);
    const j = n - LAENGE / 360;
    const m = (357.5291 + 0.98560028 * j) % 360;
    const c = 1.9148 * Math.sin(m * rad) + 0.02 * Math.sin(2 * m * rad) + 0.0003 * Math.sin(3 * m * rad);
    const l = (m + c + 180 + 102.9372) % 360;
    const transit = 2451545 + j + 0.0053 * Math.sin(m * rad) - 0.0069 * Math.sin(2 * l * rad);
    const dekl = Math.asin(Math.sin(l * rad) * Math.sin(23.4397 * rad));
    const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(BREITE * rad) * Math.sin(dekl)) / (Math.cos(BREITE * rad) * Math.cos(dekl))) / rad;
    const datum = (jd) => new Date((jd - 2440587.5) * 864e5);
    return { auf: datum(transit - w / 360), unter: datum(transit + w / 360) };
  }
  const DESIGNS = window.DESIGNS || [];
  const lies = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const merke = (k, v) => { try { localStorage.setItem(k, v); } catch { /* nur Komfort */ } };
  const gueltig = (id, art) => DESIGNS.some((d) => d.id === id && d.art === art) ? id : (DESIGNS.find((d) => d.art === art) || {}).id;
  // Die Wahl bleibt gespeichert, bis sie im Reiter System wieder umgestellt wird.
  const design = { hell: gueltig(lies("design-hell"), "hell"), dunkel: gueltig(lies("design-dunkel"), "dunkel") };
  function stand() {
    const jetzt = new Date(), s = sonne(jetzt);
    const aktiv = wahl !== "auto" ? wahl : jetzt >= s.auf && jetzt < s.unter ? "hell" : "dunkel";
    const d = DESIGNS.find((x) => x.id === design[aktiv]);
    return { wahl, aktiv, design: d, auf: s.auf, unter: s.unter };
  }
  const CSS = { grund: "--grund", flaeche: "--flaeche", rand: "--rand", text: "--text", leise: "--leise", akzent: "--akzent", aufAkzent: "--auf-akzent", gut: "--gut", warn: "--warn", gefahr: "--gefahr" };
  function anwenden() {
    const s = stand(), wurzel = document.documentElement;
    wurzel.dataset.thema = s.aktiv;
    if (s.design) {
      for (const [k, v] of Object.entries(CSS)) wurzel.style.setProperty(v, s.design.ui[k]);
      wurzel.style.setProperty("--term", s.design.term.background);
    }
    return s;
  }
  function waehlen(neu) {
    wahl = ERLAUBT.includes(neu) ? neu : "auto";
    merke("thema", wahl);
    return anwenden();
  }
  function designWaehlen(art, id) {
    design[art] = gueltig(id, art);
    merke(`design-${art}`, design[art]);
    return anwenden();
  }
  window.Thema = { anwenden, waehlen, designWaehlen, wahl: () => wahl, design: (art) => design[art], designs: DESIGNS };
  anwenden();
})();
</script>
</head>
<body>
<nav id="reiter">
  <button data-seite="sitzungen" class="an">Sitzungen</button>
  <button data-seite="terminal">Terminal</button>
  <button data-seite="launcher">OpenLauncher</button>
  <button data-seite="browser">Browser</button>
  <button data-seite="system">System</button>
</nav>

<main>
  <section id="sitzungen" class="seite an">
    <p id="auslastung" class="leise"></p>
    <div id="liste"></div>
    <div class="zeile">
      <button id="neu-pwsh">Neue PowerShell</button>
    </div>
  </section>

  <section id="terminal" class="seite">
    <div id="kopf"><span id="titel" class="leise">Keine Sitzung gewählt</span><button id="schliessen" class="gefahr klein" hidden>Sitzung schließen</button></div>
    <div id="links"></div>
    <div id="xterm"><button id="nach-unten" title="Zum aktuellen Stand" hidden>⤓</button></div>
    <div id="stimme" hidden>
      <span id="stimme-meldung" hidden></span>
      <button id="stimme-zeile" title="Zeile löschen">✕</button>
      <button id="stimme-tastatur" title="Tastatur ein- oder ausblenden">⌨</button>
      <button id="stimme-auto" title="Automatisch absenden">↵ aus</button>
      <button id="stimme-mikro" title="Sprechen">🎤</button>
    </div>
    <div id="tasten-wahl"><div id="buchstaben" hidden></div><div id="menue" hidden></div></div>
    <div id="tasten">
      <button data-t="&#27;">Esc</button><button id="strg">STRG</button><button id="alt">ALT</button><button data-t="&#9;">Tab</button>
      <button data-t="&#27;[A">↑</button><button data-t="&#27;[B">↓</button><button data-t="&#27;[D">←</button><button data-t="&#27;[C">→</button>
    </div>
    <form id="eingabe"><textarea id="text" rows="1" inputmode="none" placeholder="Eingabe an die CLI" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><button>Senden</button></form>
  </section>

  <section id="launcher" class="seite">
    <label>Modell<select id="modell"></select></label>
    <label>CLI<select id="cli"></select></label>
    <label>Profil<select id="profil"></select></label>
    <label>Modus<select id="modus"></select></label>
    <label>Effort<select id="effort"></select></label>
    <label>Erste Nachricht (optional)<textarea id="prompt" rows="3"></textarea></label>
    <button id="start" class="haupt">Starten</button>
    <p id="start-meldung" class="leise"></p>
  </section>

  <section id="browser" class="seite">
    <p id="browser-meldung" class="leise">Der Browser startet …</p>
    <iframe id="browser-bild" title="Chrome auf dem Server" hidden></iframe>
  </section>

  <section id="system" class="seite">
    <div class="karte">
      <label>Darstellung<select id="thema-wahl">
        <option value="auto">Automatisch (Sonnenauf- und -untergang Berlin)</option>
        <option value="hell">Hell</option>
        <option value="dunkel">Dunkel</option>
      </select></label>
      <label>Helles Design<select id="design-hell"></select></label>
      <div id="vorschau-hell" class="vorschau"></div>
      <label>Dunkles Design<select id="design-dunkel"></select></label>
      <div id="vorschau-dunkel" class="vorschau"></div>
      <div id="thema-info" class="leise"></div>
    </div>
    <div id="programme"></div>
    <div class="zeile"><button id="update">CLIs jetzt aktualisieren</button></div>
    <p id="system-info" class="leise"></p>
  </section>
</main>

<script defer src="/static/xterm.js?v=5.5.0"></script>
<script defer src="/static/addon-fit.js?v=0.10.0"></script>
<script defer src="/static/app.js"></script>
</body>
</html>
