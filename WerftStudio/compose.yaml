services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: werft
      POSTGRES_USER: werft
      POSTGRES_PASSWORD: werft
    ports: ["5432:5432"]
    volumes: ["werft-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werft"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["werft-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: werft
      MINIO_ROOT_PASSWORD: change-me-locally
    ports: ["9000:9000", "9001:9001"]
    volumes: ["werft-minio:/data"]
volumes:
  werft-postgres:
  werft-redis:
  werft-minio:
