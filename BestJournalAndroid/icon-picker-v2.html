<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a12;color:#e0e0e0;min-height:100vh;padding:20px 12px}
  h1{text-align:center;font-size:2rem;font-weight:700;background:linear-gradient(135deg,#ff6b6b,#ffa502,#ff6348);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
  .sub{text-align:center;color:#666;font-size:.85rem;margin-bottom:14px}
  .filters{text-align:center;margin-bottom:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .filters button{background:#151520;border:1px solid #333;color:#999;padding:5px 12px;border-radius:16px;cursor:pointer;font-size:.75rem;transition:all .2s}
  .filters button:hover,.filters button.active{background:#ff6348;color:#fff;border-color:#ff6348}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:1800px;margin:0 auto}
  .card{background:#12121e;border-radius:18px;padding:12px;text-align:center;cursor:pointer;transition:all .3s;border:2px solid transparent;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(255,99,72,.2);border-color:#ff6348}
  .card.selected{border-color:#ffa502;box-shadow:0 0 25px rgba(255,165,2,.3);transform:translateY(-3px)}
  .card.selected::after{content:'\2713';position:absolute;top:8px;right:12px;font-size:1.2rem;color:#ffa502;font-weight:bold}
  .card.hidden{display:none}
  .iw{width:220px;height:220px;margin:0 auto 8px;border-radius:44px;overflow:hidden}
  .iw svg{width:220px;height:220px}
  .cn{font-size:.8rem;font-weight:600;color:#ccc}
  .cnum{font-size:.65rem;color:#555}
  .footer{text-align:center;margin-top:30px;padding:16px}
  .si{font-size:1rem;color:#ffa502;font-weight:600;min-height:24px}
  .cnt{text-align:center;color:#444;font-size:.75rem;margin-bottom:14px}
  /* Fullscreen overlay */
  .overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}
  .overlay.show{display:flex}
  .overlay svg{width:min(80vw,80vh);height:min(80vw,80vh);border-radius:20%}
  .overlay .olbl{color:#fff;font-size:1.3rem;margin-top:16px;font-weight:600}
  .overlay .ohint{color:#666;font-size:.8rem;margin-top:6px}
</style>
</head>

const grid=document.getElementById('grid'),info=document.getElementById('si'),cntEl=document.getElementById('cnt'),ov=document.getElementById('ov'),ovlbl=document.getElementById('ovlbl');
let sel=null;
I.forEach((ic,i)=>{
  const d=document.createElement('div');
  d.className='card';d.dataset.cat=ic.c;
  d.innerHTML=`<div class="iw">${ic.s}</div><div class="cn">${ic.n}</div><div class="cnum">#${i+1}</div>`;
  d.addEventListener('click',()=>{ov.innerHTML=ic.s+`<div class="olbl">#${i+1} — ${ic.n}</div><div class="ohint">Klicke um zu schliessen</div>`;ov.classList.add('show')});
  d.addEventListener('dblclick',(e)=>{e.stopPropagation();document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));d.classList.add('selected');sel=i+1;info.textContent=`Ausgewaehlt: #${sel} — ${ic.n}`});
  grid.appendChild(d);
});
ov.addEventListener('click',()=>ov.classList.remove('show'));
document.querySelectorAll('.filters button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');const cat=btn.dataset.cat;let vis=0;
    document.querySelectorAll('.card').forEach(c=>{if(cat==='all'||c.dataset.cat===cat){c.classList.remove('hidden');vis++}else c.classList.add('hidden')});
    cntEl.textContent=`${vis} Icons`;
  });
});
</script>
