<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Journal — 100 Icon Designs</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;padding:30px 16px}
  h1{text-align:center;font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .subtitle{text-align:center;color:#888;font-size:.95rem;margin-bottom:12px}
  .filters{text-align:center;margin-bottom:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .filters button{background:#1a1a2e;border:1px solid #333;color:#aaa;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;transition:all .2s}
  .filters button:hover,.filters button.active{background:#667eea;color:#fff;border-color:#667eea}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;max-width:1400px;margin:0 auto}
  .card{background:#1a1a2e;border-radius:16px;padding:14px;text-align:center;cursor:pointer;transition:all .3s;border:2px solid transparent;position:relative}
  .card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(102,126,234,.25);border-color:#667eea}
  .card.selected{border-color:#f093fb;box-shadow:0 0 25px rgba(240,147,251,.35);transform:translateY(-4px)}
  .card.selected::after{content:'\2713';position:absolute;top:8px;right:10px;font-size:1.2rem;color:#f093fb;font-weight:bold}
  .card.hidden{display:none}
  .iw{width:120px;height:120px;margin:0 auto 10px;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .iw svg{width:120px;height:120px}
  .cn{font-size:.82rem;font-weight:600;color:#ccc;margin-bottom:2px}
  .cnum{font-size:.7rem;color:#555}
  .footer{text-align:center;margin-top:40px;padding:20px}
  .footer p{color:#666;font-size:.85rem;margin-bottom:10px}
  .si{font-size:1.1rem;color:#f093fb;font-weight:600;min-height:28px}
  .count{text-align:center;color:#555;font-size:.8rem;margin-bottom:20px}
</style>
</head>
<body>
<h1>Best Journal — Icon Auswahl</h1>
<p class="subtitle">100 einzigartige Designs. Klicke auf deinen Favoriten.</p>
<div class="filters">
  <button class="active" data-cat="all">Alle (100)</button>
  <button data-cat="nature">Natur</button>
  <button data-cat="cosmos">Kosmos</button>
  <button data-cat="minimal">Minimal</button>
  <button data-cat="abstract">Abstrakt</button>
  <button data-cat="writing">Schreiben</button>
  <button data-cat="luxury">Luxus</button>
  <button data-cat="culture">Kultur</button>
  <button data-cat="mood">Stimmung</button>
  <button data-cat="retro">Retro</button>
</div>
<div class="count" id="count">100 Icons</div>
<div class="grid" id="grid"></div>
<div class="footer">
  <div class="si" id="si"></div>
  <p>Sag mir die Nummer deines Favoriten!</p>
</div>

const grid=document.getElementById('grid');
const info=document.getElementById('si');
const countEl=document.getElementById('count');
let sel=null;

I.forEach((ic,i)=>{
  const d=document.createElement('div');
  d.className='card';
  d.dataset.cat=ic.c;
  d.innerHTML=`<div class="iw">${ic.s}</div><div class="cn">${ic.n}</div><div class="cnum">#${i+1}</div>`;
  d.addEventListener('click',()=>{
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
    d.classList.add('selected');
    sel=i+1;
    info.textContent=`Ausgewaehlt: #${sel} — ${ic.n}`;
  });
  grid.appendChild(d);
});

document.querySelectorAll('.filters button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const cat=btn.dataset.cat;
    let vis=0;
    document.querySelectorAll('.card').forEach(c=>{
      if(cat==='all'||c.dataset.cat===cat){c.classList.remove('hidden');vis++}
      else c.classList.add('hidden');
    });
    countEl.textContent=`${vis} Icons`;
  });
});
</script>
