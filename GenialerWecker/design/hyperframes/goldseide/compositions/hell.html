<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="goldseide.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1440px; overflow: hidden; background: #FAF7F0; }
      #leinwand { display: block; width: 720px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hell" data-start="0" data-duration="16" data-width="720" data-height="1440">
      <canvas id="leinwand" class="clip" width="720" height="1440" data-start="0" data-duration="16" data-track-index="0"></canvas>
    </div>
    <script>
      // Schlicht hell: Hintergrund #FAF7F0, Gold #8B6914, warmer Akzent #A34F00 — exakt die Palette der App.
      const tl = goldseide({
        leinwandId: "leinwand", dauer: 16, saat: 1978,
        grund: "#FAF7F0", gold: "#E3B341", warm: "#A34F00", hell: "#FFFFFF",
        mischung: "source-over", feldAlpha: [0.16, 0.06, 0.4],
        schleierAlpha: 0.45,
        baender: [
          { y: 0.30, neigung: 0.10, welle: 95, freq: 0.9, lauf: 1, atmen: 1, phase: 0.3, dicke: 140, faeden: 32, faden: 1.2, alpha: 0.62, farbe: "#A9812A", licht: "#C9922B", schein: 0.07, glanz: 0.6, glanzFarbe: "#8B6914" },
          { y: 0.56, neigung: -0.14, welle: 120, freq: 0.7, lauf: -1, atmen: 2, phase: 2.1, dicke: 170, faeden: 36, faden: 1.1, alpha: 0.50, farbe: "#A34F00", licht: "#A9812A", schein: 0.06, glanz: 0.5, glanzFarbe: "#A34F00" },
          { y: 0.82, neigung: 0.08, welle: 85, freq: 1.1, lauf: 1, atmen: 1, phase: 4.0, dicke: 110, faeden: 26, faden: 1.1, alpha: 0.46, farbe: "#A9812A", licht: "#C9922B", schein: 0.06, glanz: 0.55, glanzFarbe: "#8B6914" },
        ],
        bokehAnzahl: 9, bokehAlpha: 0.5, bokehFarbe: "#FFFFFF",
        staubAnzahl: 24, staubAlpha: 0.55, staubFarbe: "#C9922B", staubKern: "#8B6914",
        vignette: 0.06,
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["hell"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
