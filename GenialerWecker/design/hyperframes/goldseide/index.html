<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="goldseide.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1440px; overflow: hidden; background: #121212; }
      #leinwand { display: block; width: 720px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="720" data-height="1440">
      <canvas id="leinwand" class="clip" width="720" height="1440" data-start="0" data-duration="16" data-track-index="0"></canvas>
    </div>
    <script>
      // Schlicht dunkel: Hintergrund #121212, Gold #E3B341, warmer Akzent #C25E00 — exakt die Palette der App.
      const tl = goldseide({
        leinwandId: "leinwand", dauer: 16, saat: 1978,
        grund: "#121212", gold: "#E3B341", warm: "#C25E00", hell: "#F6D98B",
        mischung: "lighter", feldAlpha: [0.2, 0.12, 0.07],
        schleierAlpha: 0.05,
        baender: [
          { y: 0.30, neigung: 0.10, welle: 70, freq: 0.9, lauf: 1, atmen: 1, phase: 0.3, dicke: 120, faeden: 22, faden: 1.1, alpha: 0.24, farbe: "#C9922B", licht: "#F6D98B" },
          { y: 0.56, neigung: -0.14, welle: 90, freq: 0.7, lauf: -1, atmen: 2, phase: 2.1, dicke: 150, faeden: 26, faden: 1.0, alpha: 0.18, farbe: "#C25E00", licht: "#E3B341" },
          { y: 0.82, neigung: 0.08, welle: 60, freq: 1.1, lauf: 1, atmen: 1, phase: 4.0, dicke: 90, faeden: 16, faden: 1.0, alpha: 0.15, farbe: "#C9922B", licht: "#F6D98B" },
        ],
        bokehAnzahl: 9, bokehAlpha: 0.07, bokehFarbe: "#F6D98B",
        staubAnzahl: 90, staubAlpha: 0.85, staubFarbe: "#E3B341", staubKern: "#FFF3D1",
        vignette: 0.22,
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
