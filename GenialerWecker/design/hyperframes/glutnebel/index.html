<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="glutnebel.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1440px; overflow: hidden; background: #0E0B09; }
      #leinwand { display: block; width: 720px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="720" data-height="1440">
      <canvas id="leinwand" class="clip" width="720" height="1440" data-start="0" data-duration="16" data-track-index="0"></canvas>
    </div>
    <script>
      // Traumraum dunkel: warmes Schwarz #0E0B09, Glut-Orange #F0813F, Bernstein #F2C48A — die Palette der App.
      const tl = glutnebel({
        leinwandId: "leinwand", dauer: 16,
        grund: "#0E0B09", mischung: "lighter",
        kuppel: "#F0813F", kuppelAlpha: 0.13,
        wolkenAnzahl: 6, wolkenAlpha: 0.16, wolkenFarben: ["#F0813F", "#8E2E14", "#F2C48A", "#B5481C"],
        funkenAnzahl: 70, funkenAlpha: 0.9, funkeHell: "#FFC27A", funkeTief: "#F0813F",
        schnuppe: "#FFE6C4", schnuppeAlpha: 0.85,
        vignette: 0.28,
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
