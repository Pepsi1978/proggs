<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="glutnebel.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1440px; overflow: hidden; background: #F7F1EA; }
      #leinwand { display: block; width: 720px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hell" data-start="0" data-duration="16" data-width="720" data-height="1440">
      <canvas id="leinwand" class="clip" width="720" height="1440" data-start="0" data-duration="16" data-track-index="0"></canvas>
    </div>
    <script>
      // Traumraum hell: warmes Papier #F7F1EA, Orange #B8460F, Bernstein #7A4A1E — die Palette der App.
      const tl = glutnebel({
        leinwandId: "leinwand", dauer: 16,
        grund: "#F7F1EA", mischung: "source-over",
        kuppel: "#F3B184", kuppelAlpha: 0.35,
        wolkenAnzahl: 6, wolkenAlpha: 0.18, wolkenFarben: ["#F0A070", "#F6CFA8", "#E98A55", "#FFE3C8"],
        funkenAnzahl: 55, funkenAlpha: 0.7, funkeHell: "#D96A26", funkeTief: "#B8460F",
        schnuppe: "#B8460F", schnuppeAlpha: 0.55,
        vignette: 0.06,
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["hell"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
