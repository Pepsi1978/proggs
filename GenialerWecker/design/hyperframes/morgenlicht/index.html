<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="morgenlicht.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1440px; overflow: hidden; background: #101416; }
      #leinwand { display: block; width: 720px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="720" data-height="1440">
      <canvas id="leinwand" class="clip" width="720" height="1440" data-start="0" data-duration="16" data-track-index="0"></canvas>
    </div>
    <script>
      // Morgenruhe dunkel: Hintergrund #101416, Tinte #9FB3D1, Messing #D0B183 — die Palette der App.
      const tl = morgenlicht({
        leinwandId: "leinwand", dauer: 16,
        grund: "#101416", himmelOben: "#0C1012", himmelUnten: "#1A1916",
        mischung: "lighter", glut: "#D0B183", messing: "#A9783E", licht: "#E9D2A8",
        horizontAlpha: 0.30, strahlAnzahl: 11, strahlAlpha: 0.055,
        nebelFarbe: "#9FB3D1",
        nebel: [
          { x: 0.0, y: 0.34, lauf: 1, breite: 0.75, hoehe: 0.05, alpha: 0.05, phase: 0.4 },
          { x: 0.45, y: 0.58, lauf: -1, breite: 0.9, hoehe: 0.06, alpha: 0.06, phase: 2.0 },
          { x: 0.2, y: 0.8, lauf: 1, breite: 1.0, hoehe: 0.07, alpha: 0.07, phase: 4.1 },
        ],
        staubAnzahl: 60, staubAlpha: 0.75, staubFarbe: "#F2DDB4", staubMischung: "lighter",
        vignette: 0.12,
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
