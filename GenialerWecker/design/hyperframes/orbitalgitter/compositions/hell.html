<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="orbitalgitter.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1440px; overflow: hidden; background: #E8F1EA; }
      #leinwand { display: block; width: 720px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hell" data-start="0" data-duration="16" data-width="720" data-height="1440">
      <canvas id="leinwand" class="clip" width="720" height="1440" data-start="0" data-duration="16" data-track-index="0"></canvas>
    </div>
    <script>
      // Orbit hell: helles Grün #E8F1EA, Waldgrün #0A7A2C, Oliv-Limette #6B8A00 — die Palette der App.
      const tl = orbitalgitter({
        leinwandId: "leinwand", dauer: 16,
        grund: "#E8F1EA", mischung: "source-over",
        linie: "#0A7A2C", signal: "#6B8A00",
        feldAlpha: 0.06, radarAlpha: 0.08, bahnAlpha: 0.25, satellitAlpha: 0.85, planetAlpha: 0.22,
        gitterAlpha: 0.18, gitterLauf: 3, punktAnzahl: 18, punktAlpha: 0.6,
        scanAlpha: 0.08, zeilenAlpha: 0.025,
        vignette: 0.0,
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["hell"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
