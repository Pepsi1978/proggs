<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="orbitalgitter.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1440px; overflow: hidden; background: #040906; }
      #leinwand { display: block; width: 720px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="720" data-height="1440">
      <canvas id="leinwand" class="clip" width="720" height="1440" data-start="0" data-duration="16" data-track-index="0"></canvas>
    </div>
    <script>
      // Orbit dunkel: Fast-Schwarz #040906, Matrix-Grün #3CF06E, Limette #D7FF6B — die Palette der App.
      const tl = orbitalgitter({
        leinwandId: "leinwand", dauer: 16,
        grund: "#040906", mischung: "lighter",
        linie: "#3CF06E", signal: "#D7FF6B",
        feldAlpha: 0.07, radarAlpha: 0.10, bahnAlpha: 0.32, satellitAlpha: 0.95, planetAlpha: 0.30,
        gitterAlpha: 0.22, gitterLauf: 3, punktAnzahl: 18, punktAlpha: 0.8,
        scanAlpha: 0.10, zeilenAlpha: 0.10,
        vignette: 0.18,
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
