<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

}
body.dark { background: #1a1a1a; color: #e0e0e0; }

}

}

.grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; padding: 32px 16px 60px; }

.variant-desc { font-size: 12px; color: #888; max-width: 300px; text-align: center; line-height: 1.4; }
.phone {

.light-bg { background: #fafafa; }

.nav-item.active .label { max-height: 20px; opacity: 1; }

/* 1. Glassmorphism */
.v1 { background: rgba(255,255,255,0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.6); }

.dark-bg .v3 .nav-item { color: #666; } .dark-bg .v3 .nav-item.active { color: #4DD0E1; }

const T=[
{icon:'auto_awesome',label:'Rueckblick'},
{icon:'analytics',label:'Dashboard'},
{icon:'book',label:'Tagebuch'},
{icon:'settings',label:'Einstellungen'},
];
const grid=document.getElementById('grid');
const isDark=()=>document.body.classList.contains('dark');
function render(){
grid.innerHTML='';
V.forEach(v=>{
const d=document.createElement('div');d.className='variant';
d.innerHTML=`<span class="variant-label">${v.name}</span>
<div class="phone"><div class="phone-content ${isDark()?'dark-bg':'light-bg'}">
<div class="fake-content">
<div class="fake-card"><div class="fake-line long"></div><div class="fake-line medium"></div><div class="fake-line short"></div></div>
<div class="fake-card"><div class="fake-line medium"></div><div class="fake-line long"></div></div>
<div class="fake-card"><div class="fake-line short"></div><div class="fake-line long"></div><div class="fake-line medium"></div></div>
<div class="fake-card"><div class="fake-line long"></div><div class="fake-line short"></div></div>
</div>
<div class="nav-bubble ${v.cls}" id="bubble-${v.id}">
${T.map((t,i)=>`<div class="nav-item ${i===2?'active':''}" onclick="setActive('${v.id}',${i})">
<span class="material-symbols-rounded">${t.icon}</span><span class="label">${t.label}</span></div>`).join('')}
</div></div></div><p class="variant-desc">${v.desc}</p>`;
grid.appendChild(d);
});
}
function setActive(vid,idx){
const b=document.getElementById('bubble-'+vid);
b.querySelectorAll('.nav-item').forEach((item,i)=>item.classList.toggle('active',i===idx));
}
function toggleDark(){document.body.classList.toggle('dark');render();}
render();
