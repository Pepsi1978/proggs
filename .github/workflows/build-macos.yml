name: macOS Build (Swift)

on:
  push:
    branches: ["main"]
    paths:
      - 'TerminalVoiceOverlay-macOS/**'
      - 'ClaudeCodexVoiceOverlay-macOS/**'
      - 'voice-overlay-sherpa.sh'
      - '.github/workflows/build-macos.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'TerminalVoiceOverlay-macOS/**'
      - 'ClaudeCodexVoiceOverlay-macOS/**'
      - 'voice-overlay-sherpa.sh'
      - '.github/workflows/build-macos.yml'

jobs:
  build-terminal-overlay:
    runs-on: macos-latest
    name: TerminalVoiceOverlay-macOS

    steps:
      - name: Projektdateien laden
        uses: actions/checkout@v5

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Swift-Version anzeigen
        run: swift --version

      - name: sherpa-onnx-Cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sherpa-onnx
          key: sherpa-onnx-${{ hashFiles('voice-overlay-sherpa.sh') }}

      - name: Build ausfuehren
        run: |
          cd TerminalVoiceOverlay-macOS

          APP_NAME="TerminalVoiceOverlay"
          SRC_DIR="$APP_NAME"
          BUILD_DIR="build"
          APP_BUNDLE="$BUILD_DIR/$APP_NAME.app"

          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          cp "$SRC_DIR/Info.plist" "$APP_BUNDLE/Contents/"

          SDK_PATH=$(xcrun --show-sdk-path)
          SWIFT_FILES=($(find "$SRC_DIR" -name "*.swift"))

          # sherpa-onnx (Offline-Transkription Parakeet) wie in build.sh einbinden
          source ../voice-overlay-sherpa.sh
          ensure_sherpa || { echo "FEHLER: sherpa-onnx nicht verfuegbar"; exit 1; }
          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          cp "$SHERPA_LIB/libsherpa-onnx-c-api.dylib" "$SHERPA_LIB/libonnxruntime.dylib" "$APP_BUNDLE/Contents/Frameworks/"

          swiftc \
              -o "$APP_BUNDLE/Contents/MacOS/$APP_NAME" \
              -import-objc-header "$SHERPA_HEADER" \
              -L "$SHERPA_LIB" -lsherpa-onnx-c-api \
              -Xlinker -rpath -Xlinker @executable_path/../Frameworks \
              -sdk "$SDK_PATH" \
              -target arm64-apple-macos13.0 \
              -framework AppKit \
              -framework AVFoundation \
              -framework CoreGraphics \
              -framework Carbon \
              -framework Network \
              -lsqlite3 \
              "${SWIFT_FILES[@]}"

          echo "Build erfolgreich: $APP_BUNDLE"

      - name: Build-Artefakt pruefen
        run: |
          test -f TerminalVoiceOverlay-macOS/build/TerminalVoiceOverlay.app/Contents/MacOS/TerminalVoiceOverlay
          echo "Binary existiert und wurde korrekt erstellt."

  build-codex-overlay:
    runs-on: macos-latest
    name: ClaudeCodexVoiceOverlay-macOS

    steps:
