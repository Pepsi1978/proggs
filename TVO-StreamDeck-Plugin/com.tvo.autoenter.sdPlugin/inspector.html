<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TVO Auto-Enter</title>
    <style>
        body {
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            font-size: 13px;
            color: #d8d8d8;
            background: #2d2d2d;
            margin: 0;
            padding: 16px;
        }
        .row { margin-bottom: 12px; }
        .label { color: #999; margin-right: 8px; }
        code { background: #1f1f1f; padding: 1px 5px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="row">
        Diese Taste spiegelt den Auto-Enter-Status des Voice Terminal Overlays.
    </div>
    <div class="row">
        <span class="label">Quelle:</span>
        <code>http://127.0.0.1:5723</code>
    </div>
    <div class="row" style="margin-top: 16px; color: #888; font-size: 11px;">
        Keine Konfiguration noetig &mdash; das Plugin verbindet sich automatisch.
        Wenn das Overlay nicht laeuft, zeigt die Taste "offline" und wartet.
    </div>
</body>
</html>
