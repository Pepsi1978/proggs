[versions]
agp = "8.10.0"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2026.03.00"
room = "2.7.0"
hilt = "2.55"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
navigationCompose = "2.8.7"
lifecycleRuntime = "2.8.7"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
coroutines = "1.9.0"
datastore = "1.1.1"
securityCrypto = "1.1.0"
appauth = "0.11.1"
media3 = "1.5.1"
workManager = "2.11.2"
vico = "2.0.0-beta.3"
glance = "1.1.1"
# Remote Compose (Frank-Wunsch 2026-05-31): brandneue Rendering-Engine fuer Widgets
# (I/O 2026). ALPHA — NICHT aktiviert, weil alpha11 AGP 9.1.0 (Projekt: 8.10.0),
# minSdk 29 (Projekt: 28 → Geraete-Ausschluss) und compileSdk 37 (Projekt: 36)
# erzwingt. Sobald die Engine reif ist + diese Anforderungen tragbar sind, hier wieder
# aktivieren:  composeRemote = "1.0.0-alpha11"  (oder neuere Version)
googleApiClient = "2.7.0"
googleDrive = "v3-rev20241206-2.0.0"
playServicesAuth = "21.3.0"
credentials = "1.5.0-alpha06"
googleId = "1.1.1"
reorderable = "2.4.0"
healthConnect = "1.1.0-alpha07"
mapsCompose = "6.4.1"
playServicesMaps = "19.0.0"
libRecur = "0.16.1"
wireguard = "1.0.20260102"

[libraries]
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material3-window = { group = "androidx.compose.material3", name = "material3-window-size-class" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# AndroidX
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntime" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version = "1.0.0" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Security (EncryptedSharedPreferences fuer API-Keys + OAuth-Tokens)
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# OAuth (Whoop + Google Calendar)
appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }

# Media3 ExoPlayer (fuer TTS-Audio-Wiedergabe)
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# WorkManager (Hintergrund-Sync, Wochenrueckblick)
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Vico Charts
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
vico-core = { group = "com.patrykandpatrick.vico", name = "core", version.ref = "vico" }

# Glance (Home-Screen-Widget — Stufe 4)
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Remote Compose (Vorbereitung — DEAKTIVIERT, siehe Kommentar bei composeRemote oben).
# Erfordert AGP 9.1.0 + minSdk 29 + compileSdk 37. Bei Reife wieder einkommentieren:
# compose-remote-core = { group = "androidx.compose.remote", name = "remote-core", version.ref = "composeRemote" }
# compose-remote-creation = { group = "androidx.compose.remote", name = "remote-creation", version.ref = "composeRemote" }
# compose-remote-creation-compose = { group = "androidx.compose.remote", name = "remote-creation-compose", version.ref = "composeRemote" }
# compose-remote-player-view = { group = "androidx.compose.remote", name = "remote-player-view", version.ref = "composeRemote" }

# Google Drive (Stufe 1 — Backup/Restore via appDataFolder)
google-api-client-android = { group = "com.google.api-client", name = "google-api-client-android", version.ref = "googleApiClient" }
google-drive-api = { group = "com.google.apis", name = "google-api-services-drive", version.ref = "googleDrive" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-play = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-id = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }

# Reorderable LazyColumn (Drag & Drop fuer Biomarker-Karten — Frank-Wunsch 2026-05-10)
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

# Health Connect (Frank-Wunsch 2026-05-10) — liest Gewicht aus der Zepp-App ueber
# den Health-Connect-Bridge der Zepp-App seit Januar 2025.
health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

# Google Maps Compose (Frank-Wunsch 2026-05-17): Satelliten-Karte mit
# eingezeichneter Strecke im Trainings-Detail. maps-compose wrapped play-services-maps
# fuer Jetpack-Compose-Verwendung. API-Key liegt in ~/SK/EntropieReductor/maps-api-key.txt.
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }

# RFC-5545 RRULE-Parser (Wiederkehrende Aufgaben — Sprint 2, Frank-Wunsch 2026-05-22)
lib-recur = { group = "org.dmfs", name = "lib-recur", version.ref = "libRecur" }

# WireGuard-Tunnel fuer private Second-Brain-Anbindung.
wireguard-tunnel = { group = "com.wireguard.android", name = "tunnel", version.ref = "wireguard" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
