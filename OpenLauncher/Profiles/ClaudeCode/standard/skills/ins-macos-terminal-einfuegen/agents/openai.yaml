interface:
  display_name: "Ins macOS Terminal einfügen"
  short_description: "Sprachaufträge sicher an dieselbe Claude-tmux-Sitzung geben"
  default_prompt: "Nutze $ins-macos-terminal-einfuegen für meinen Auftrag an dieselbe sichtbare Claude-Code-Sitzung in tmux unter macOS: Ich steuere, du koordinierst und prüfst, Claude programmiert. Ordne das Ziel sicher zu, bündele neue Wünsche und lies relevante Antworten. Führe einen beauftragten fortlaufenden Dreierdialog innerhalb seines Ziels bis zu meinem ausdrücklichen manuellen Stopp weiter; ein Ende der Sprachverbindung beendet den Auftrag nicht. Begleite jedes Update gemäß Projektregeln bis Build, Version, Commit, Rebase/Push und autorisierter Installation; prüfe konkrete Nachweise, kennzeichne Review-Zwischenstände und melde eine ausstehende Installation samt APK-Pfad ausdrücklich."
policy:
  allow_implicit_invocation: true
